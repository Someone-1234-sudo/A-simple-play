
<DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Simple Play - Navegador</title>
    <style>
        body {
            font-family: monospace;
            background-color: #222;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-board {
            font-size: 24px;
            line-height: 24px;
            background: #111;
            display: inline-block;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 4px;
            white-space: pre; /* Mantém a formatação da matriz/grade */
            margin-top: 15px;
        }
        .score {
            font-size: 20px;
            margin: 10px 0;
            color: #4af;
        }
        .instructions {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>A Simple Play 🎮</h1>
    <p class="instructions">Use as teclas <b>W, A, S, D</b> ou as <b>Setas do Teclado</b> para mover o <b>P</b>.</p>
    <div class="score">Frutas coletadas: <span id="score-val">0</span></div>
    
    <!-- A grade do jogo será renderizada aqui dentro -->
    <div id="game-board"></div>

    <script>
        // Configurações iniciais do mapa (Grade 10x10)
        const size = 10;
        let player = { x: 1, y: 1 };
        let fruit = { x: 5, y: 5 };
        let obstacle = { x: 3, y: 7 };
        let score = 0;

        const boardElement = document.getElementById('game-board');
        const scoreElement = document.getElementById('score-val');

        // Função para gerar uma posição aleatória no mapa
        function randomPos() {
            return Math.floor(Math.random() * size);
        }

        // Função principal que desenha a matriz na tela do navegador
        function drawMap() {
            let mapStr = "";
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (x === player.x && y === player.y) {
                        mapStr += "P "; // Jogador
                    } else if (x === fruit.x && y === fruit.y) {
                        mapStr += "🍎"; // Fruta (Substitui a letra por emoji se quiser)
                    } else if (x === obstacle.x && y === obstacle.y) {
                        mapStr += "💥"; // Obstáculo (!)
                    } else {
                        mapStr += ". "; // Espaço vazio
                    }
                }
                mapStr += "\n";
            }
            boardElement.textContent = mapStr;
        }

        // Função que detecta colisões e lógicas do jogo
        function checkRules() {
            // Se coletar a fruta
            if (player.x === fruit.x && player.y === fruit.y) {
                score++;
                scoreElement.textContent = score;
                // Move a fruta e o obstáculo para novas posições aleatórias
                fruit = { x: randomPos(), y: randomPos() };
                obstacle = { x: randomPos(), y: randomPos() };
            }

            // Se colidir com o obstáculo
            if (player.x === obstacle.x && player.y === obstacle.y) {
                alert(`Game Over! Você colidiu. Pontuação final: ${score}`);
                score = 0;
                scoreElement.textContent = score;
                player = { x: 1, y: 1 };
                fruit = { x: 5, y: 5 };
                obstacle = { x: 3, y: 7 };
            }
        }

        // Evento que escuta as teclas pressionadas (Substitui o pynput / input)
        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();

            if ((key === 'w' || event.key === 'ArrowUp') && player.y > 0) player.y--;
            if ((key === 's' || event.key === 'ArrowDown') && player.y < size - 1) player.y++;
            if ((key === 'a' || event.key === 'ArrowLeft') && player.x > 0) player.x--;
            if ((key === 'd' || event.key === 'ArrowRight') && player.x < size - 1) player.x++;

            checkRules();
            drawMap();
        });

        // Inicializa o jogo desenhando a primeira rodada
        drawMap();
    </script>
</body>
</html>
